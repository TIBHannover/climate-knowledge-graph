<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mermaid Live Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header strong { font-size: 1rem; }
    header select {
      background: #313244; color: #cdd6f4; border: none;
      padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer;
    }
    #error-bar {
      background: #f38ba8; color: #1e1e2e; font-size: 0.8rem;
      padding: 0.3rem 1rem; display: none;
    }

    .panes {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #editor {
      width: 40%;
      min-width: 200px;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.9rem;
      padding: 1rem;
      border: none;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    .divider {
      width: 5px;
      background: #313244;
      cursor: col-resize;
    }
    .divider:hover { background: #89b4fa; }

    #preview {
      flex: 1;
      background: #fff;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    #preview svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <header>
    <strong>Mermaid Live Editor</strong>
    <label>Theme:
      <select id="theme-select">
        <option value="default">Default</option>
        <option value="neutral">Neutral</option>
        <option value="dark">Dark</option>
        <option value="forest">Forest</option>
        <option value="base">Base</option>
      </select>
    </label>
    <button id="copy-btn" style="margin-left:auto; background:#89b4fa; color:#1e1e2e; border:none; padding:0.25rem 0.75rem; border-radius:4px; cursor:pointer;">Copy SVG</button>
  </header>
  <div id="error-bar"></div>

  <div class="panes">
    <textarea id="editor" spellcheck="false">flowchart LR
    IPCC([IPCC Report]) --> Build

    subgraph Build[" Build "]
        Website[Website]
        Datasets[Datasets]
        ER[ER Model]
    end

    Build --> KG[(Knowledge\nGraph)]

    KG --> Services

    subgraph Services[" Services "]
        QA[Q & A]
        Lib[Library Metadata]
        Docs[Document Distribution]
        Bench[Data Bench]
    end

    Services --> Users

    subgraph Users[" Users "]
        Public[Public]
        Scientists[Scientists]
        Policy[Policy Makers]
    end</textarea>

    <div class="divider" id="divider"></div>
    <div id="preview"></div>
  </div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const editor   = document.getElementById('editor');
    const preview  = document.getElementById('preview');
    const errorBar = document.getElementById('error-bar');
    const themeSel = document.getElementById('theme-select');
    const copyBtn  = document.getElementById('copy-btn');
    let debounce;

    async function render() {
      const code  = editor.value.trim();
      const theme = themeSel.value;
      mermaid.initialize({ startOnLoad: false, theme, securityLevel: 'loose' });
      try {
        const id = 'mermaid-' + Date.now();
        const { svg } = await mermaid.render(id, code);
        preview.innerHTML = svg;
        errorBar.style.display = 'none';
      } catch (e) {
        errorBar.textContent = e.message ?? 'Parse error';
        errorBar.style.display = 'block';
      }
    }

    editor.addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 400); });
    themeSel.addEventListener('change', render);
    copyBtn.addEventListener('click', () => {
      const svg = preview.querySelector('svg');
      if (svg) navigator.clipboard.writeText(svg.outerHTML).then(() => { copyBtn.textContent = 'Copied!'; setTimeout(() => copyBtn.textContent = 'Copy SVG', 1500); });
    });

    // Draggable divider
    const divider = document.getElementById('divider');
    divider.addEventListener('mousedown', e => {
      e.preventDefault();
      const onMove = ev => { editor.style.width = Math.max(150, ev.clientX) + 'px'; };
      const onUp   = ()  => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    render();
  </script>
</body>
</html>
